packages:
  - .
  - simulator

minimumReleaseAge: 4320

overrides:
  undici: '>=7.29.0 <8'

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

auditConfig:
  ignoreGhsas:
    # sprintf-js DoS via electron-builder > @electron/get > global-agent > roarr.
    # No patched release (>=1.1.4) existed when added. The audit workflow fails
    # once one is installable; then drop this entry and refresh the lockfile.
    - GHSA-hp3w-g68c-fv3c
    # minimatch DoS via globparts amplification. Only fixed in 11.0.1; the
    # 3.x/5.x/9.x/10.x lines pulled by eslint, electron-builder and others have
    # no backport. Build/dev tooling only. Drop once parents move to >=11.0.1.
    - GHSA-g3hv-75wg-m249
